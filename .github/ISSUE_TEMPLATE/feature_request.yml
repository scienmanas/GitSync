name: Feature request
description: An idea to make GitSync better
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Have a look at [Coming in 3.0.0](https://github.com/scienmanas/GitSync#coming-in-300-) first - it may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you're trying to do, and what gets in the way today.
      placeholder: "I back up repos from two organizations, but ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How you imagine it working - a command, a flag, a setting in .env ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use today, or other ways it could work.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
